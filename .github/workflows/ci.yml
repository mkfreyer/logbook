name: Vérifications M0

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Vérifier TypeScript
        run: npm run typecheck
      - name: Tester SQLite, les formulaires et la navigation
        run: npm test
      - name: Exporter le JavaScript iOS
        run: npm run export:ios
        env:
          CI: '1'
